version: "3.1"

intents:
  - greet
  - goodbye
  - ask_menu
  - order_item
  - modify_order
  - finalize_order
  - takeaway_order
  - dine_in_order
  - cancel_order

slots:
  order:
    type: text
    mappings:
      - type: from_entity
        entity: item

responses:
  utter_greet:
    - text: "Hey! I am a restaurant assistant. How can I help you today?"

  utter_goodbye:
    - text: "Goodbye! Have a great day."

actions:
  - action_fetch_menu

entities:
  - item
  - quantity

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
